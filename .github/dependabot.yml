version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"

  # macOS app package (CoreKit Swift products, exact-pinned).
  - package-ecosystem: "swift"
    directory: "/app/SymairaEraseMe"
    schedule:
      interval: "weekly"
    groups:
      symaira-corekit:
        patterns:
          - "*symaira-corekit*"
