name: Rust prerelease archive proof

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  native-release-binary:
    name: Native Rust release binary / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            os: darwin
            arch: arm64
            target: aarch64-apple-darwin
            host: aarch64-apple-darwin
            rustflags: ''
          - name: macOS amd64
            runner: macos-15-intel
            os: darwin
            arch: amd64
            target: x86_64-apple-darwin
            host: x86_64-apple-darwin
            rustflags: ''
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
            host: aarch64-unknown-linux-gnu
            rustflags: ''
          - name: Linux amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
            host: x86_64-unknown-linux-gnu
            rustflags: ''
          - name: Windows arm64
            runner: windows-11-arm
            os: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            host: aarch64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - name: Windows amd64
            runner: windows-2025
            os: windows
            arch: amd64
            target: x86_64-pc-windows-msvc
            host: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read release version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          from pathlib import Path
          print("RELEASE_VERSION=" + tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Install Go oracle toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install static Linux linker
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add "$TARGET" --toolchain "$RUST_TOOLCHAIN"

      - name: Verify native build host
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          rustc +"$RUST_TOOLCHAIN" -vV
          test "$(rustc +"$RUST_TOOLCHAIN" -vV | sed -n 's/^host: //p')" = "$EXPECTED_HOST"

      - name: Build, smoke test, and inspect native release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_OS: ${{ matrix.os }}
          ARCHIVE_ARCH: ${{ matrix.arch }}
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" build --release -p symeraseme-cli --bin symeraseme-rust --target "$TARGET" --locked
          if [[ "$RUNNER_OS" == Windows ]]; then
            binary="target/$TARGET/release/symeraseme-rust.exe"
          else
            binary="target/$TARGET/release/symeraseme-rust"
          fi
          test -f "$binary"
          test "$("$binary" --version)" = "symeraseme version $RELEASE_VERSION"
          "$binary" --help >/dev/null

          case "$RUNNER_OS" in
            Linux)
              if readelf -lW "$binary" | grep -q ' INTERP ' ||
                 readelf -dW "$binary" | grep -q '(NEEDED)'; then
                echo "Linux release binary requires a dynamic loader or shared library" >&2
                exit 1
              fi
              readelf -h "$binary"
              ;;
            macOS)
              otool -L "$binary"
              while IFS= read -r dependency; do
                case "$dependency" in
                  /System/*|/usr/lib/*) ;;
                  *) echo "non-system macOS dependency: $dependency" >&2; exit 1 ;;
                esac
              done < <(otool -L "$binary" | tail -n +2 | awk '{print $1}')
              ;;
            Windows)
              # shellcheck disable=SC2016
              BINARY_PATH="$(cygpath -aw "$binary")" powershell.exe -NoProfile -NonInteractive -Command '
                $ErrorActionPreference = "Stop"
                $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
                $vs = & $vswhere -latest -products * -property installationPath
                if (-not $vs) { throw "Visual C++ tools were not found" }
                $hosts = if ("${{ matrix.arch }}" -eq "arm64") { @("Hostarm64\arm64", "Hostx64\x64") } else { @("Hostx64\x64", "Hostarm64\arm64") }
                $dumpbin = $null
                foreach ($hostPath in $hosts) {
                  $candidate = Get-ChildItem (Join-Path $vs "VC\Tools\MSVC") -Directory |
                    Sort-Object Name -Descending |
                    ForEach-Object { Join-Path $_.FullName ("bin\" + $hostPath + "\dumpbin.exe") } |
                    Where-Object { Test-Path $_ } |
                    Select-Object -First 1
                  if ($candidate) { $dumpbin = $candidate; break }
                }
                if (-not $dumpbin) { throw "dumpbin.exe was not found" }
                $imports = & $dumpbin /DEPENDENTS "$env:BINARY_PATH"
                if ($LASTEXITCODE -ne 0) { throw "dumpbin /DEPENDENTS failed" }
                $importsPath = Join-Path $env:RUNNER_TEMP "symeraseme-rust-dependencies.txt"
                [System.IO.File]::WriteAllLines($importsPath, [string[]]$imports)
                python "$env:GITHUB_WORKSPACE\scripts\verify_windows_dll_dependencies.py" `
                  "$importsPath" "$env:WINDIR\System32"
                if ($LASTEXITCODE -ne 0) { throw "Windows DLL dependency verification failed" }
              '
              ;;
            *)
              echo "unsupported native runner OS: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          cp "$binary" "$RUNNER_TEMP/rust-binary-$ARCHIVE_OS-$ARCHIVE_ARCH"

      - name: Build matching Go fallback and probe both dispatch paths
        shell: bash
        env:
          ARCHIVE_OS: ${{ matrix.os }}
          ARCHIVE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          export GOWORK=off GOENV=off GOTOOLCHAIN=local CGO_ENABLED=0
          go_binary="$RUNNER_TEMP/go-binary-$ARCHIVE_OS-$ARCHIVE_ARCH"
          go_build_output="$go_binary"
          pair="$RUNNER_TEMP/fallback-probe-$ARCHIVE_OS-$ARCHIVE_ARCH"
          rust_name=symeraseme
          go_name=symeraseme-go
          mkdir -p "$pair/home" "$pair/data"
          if [[ "$RUNNER_OS" == Windows ]]; then
            go_build_output+=".exe"
            rust_name+=".exe"
            go_name+=".exe"
          fi
          probe_command() {
            local stage="$1"
            shift
            local stdout="$pair/$stage.stdout"
            local stderr="$pair/$stage.stderr"
            printf 'fallback_probe_stage=%s\n' "$stage"
            if "$@" >"$stdout" 2>"$stderr"; then
              printf 'fallback_probe_result=%s status=passed\n' "$stage"
            else
              local status=$?
              printf '::error title=Fallback probe failed::stage=%s exit=%s\n' "$stage" "$status"
              printf '%s stdout:\n' "$stage" >&2
              cat "$stdout" >&2
              printf '%s stderr:\n' "$stage" >&2
              cat "$stderr" >&2
              return "$status"
            fi
          }

          compare_probe() {
            local stage="$1"
            local expected="$2"
            local actual="$3"
            printf 'fallback_probe_stage=%s\n' "$stage"
            if cmp -s "$expected" "$actual"; then
              printf 'fallback_probe_result=%s status=matched\n' "$stage"
            else
              local diff_status=0
              diff -u "$expected" "$actual" >"$pair/$stage.diff" || diff_status=$?
              if [[ "$diff_status" -gt 1 ]]; then
                printf 'fallback_probe_diff_status=%s\n' "$diff_status" >&2
              fi
              printf '::error title=Fallback probe mismatch::stage=%s\n' "$stage"
              cat "$pair/$stage.diff" >&2
              return 1
            fi
          }

          probe_command go-build go build -trimpath -ldflags "-s -w -X main.versionValue=$RELEASE_VERSION" -o "$go_build_output" ./cmd/symeraseme
          if [[ "$go_build_output" != "$go_binary" ]]; then
            probe_command stage-go-binary cp "$go_build_output" "$go_binary"
          fi

          rust_pair="$pair/$rust_name"
          go_pair="$pair/$go_name"
          probe_command stage-rust-binary cp "$RUNNER_TEMP/rust-binary-$ARCHIVE_OS-$ARCHIVE_ARCH" "$rust_pair"
          probe_command stage-go-fallback cp "$go_binary" "$go_pair"

          probe_command go-version env HOME="$pair/home" SYMERASEME_DATA_DIR="$pair/data" \
            "$go_pair" version --json
          probe_command rust-go-version env HOME="$pair/home" SYMERASEME_DATA_DIR="$pair/data" SYMERASEME_BACKEND=go \
            "$rust_pair" version --json
          compare_probe version-output "$pair/go-version.stdout" "$pair/rust-go-version.stdout"

          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"archive-fallback-probe","version":"1"}}}' > "$pair/initialize.json"
          probe_command go-mcp env HOME="$pair/home" SYMERASEME_DATA_DIR="$pair/data" \
            "$go_pair" mcp --stdio < "$pair/initialize.json"
          probe_command rust-go-mcp env HOME="$pair/home" SYMERASEME_DATA_DIR="$pair/data" SYMERASEME_BACKEND=go \
            "$rust_pair" mcp --stdio < "$pair/initialize.json"
          compare_probe mcp-output "$pair/go-mcp.stdout" "$pair/rust-go-mcp.stdout"

      - name: Upload native binary for same-run archive verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-prerelease-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/rust-binary-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload matching Go fallback for same-run archive verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-prerelease-go-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/go-binary-${{ matrix.os }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  verify-archives:
    name: Stage and verify the six archives
    needs: native-release-binary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read release version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib
          from pathlib import Path
          print("RELEASE_VERSION=" + tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])
          PY

      - name: Download same-run native binaries
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: rust-prerelease-*
          path: ${{ runner.temp }}/rust-prerelease-binaries
          merge-multiple: true

      - name: Stage and verify release archives and checksums
        shell: bash
        env:
          BINARIES: ${{ runner.temp }}/rust-prerelease-binaries
          DIST: ${{ runner.temp }}/rust-prerelease-dist
        run: |
          set -euo pipefail
          python3 scripts/stage_rust_release_archives.py \
            --version "$RELEASE_VERSION" \
            --output "$DIST" \
            --darwin-amd64 "$BINARIES/rust-binary-darwin-amd64" \
            --darwin-arm64 "$BINARIES/rust-binary-darwin-arm64" \
            --linux-amd64 "$BINARIES/rust-binary-linux-amd64" \
            --linux-arm64 "$BINARIES/rust-binary-linux-arm64" \
            --windows-amd64 "$BINARIES/rust-binary-windows-amd64" \
            --windows-arm64 "$BINARIES/rust-binary-windows-arm64" \
            --go-darwin-amd64 "$BINARIES/go-binary-darwin-amd64" \
            --go-darwin-arm64 "$BINARIES/go-binary-darwin-arm64" \
            --go-linux-amd64 "$BINARIES/go-binary-linux-amd64" \
            --go-linux-arm64 "$BINARIES/go-binary-linux-arm64" \
            --go-windows-amd64 "$BINARIES/go-binary-windows-amd64" \
            --go-windows-arm64 "$BINARIES/go-binary-windows-arm64"
          python3 tests/verify_release_archives.py "$DIST" --require-go-fallback

      - name: Upload verified shadow archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symeraseme-rust-prerelease-archives
          path: ${{ runner.temp }}/rust-prerelease-dist
          if-no-files-found: error
          retention-days: 1
