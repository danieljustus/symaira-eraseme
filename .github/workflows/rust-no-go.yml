name: Frozen parity without Go

on:
  pull_request:
    paths:
      - rust-tests/parity/**
      - crates/symeraseme-core/src/timeutil.rs
      - crates/symeraseme-core/src/confirmation.rs
      - crates/symeraseme-core/src/identity/profile.rs
      - crates/symeraseme-core/src/storage/encryption.rs
      - crates/symeraseme-core/tests/identity_interop.rs
      - crates/symeraseme-core/tests/encryption_parity.rs
      - crates/symeraseme-core/tests/triage_service.rs
      - crates/symeraseme-core/tests/projection_oversized_parity.rs
      - crates/symeraseme-core/tests/config_parity.rs
      - crates/symeraseme-core/tests/sqlite_contract.rs
      - crates/symeraseme-core/tests/campaign_execution_oracle.rs
      - crates/symeraseme-core/tests/campaign_plan_contract.rs
      - crates/symeraseme-core/tests/support/frozen_campaign_oracle.rs
      - crates/symeraseme-core/tests/support/frozen_go_oracle.rs
      - tests/fixtures/go-frozen/**
      - crates/symeraseme-engine/tests/scheduler_parity.rs
      - crates/symeraseme-engine/tests/scheduler_install_parity.rs
      - .gitattributes
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - .github/workflows/rust-no-go.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-no-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frozen-neutral:
    name: Rust / frozen neutral and crypto parity without Go
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # SQLite verifies immutable Python and Go archive blobs.
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Fetch locked Rust dependencies
        run: cargo +1.98.0 fetch --locked
      - name: Execute default suite with Go absent from PATH
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import tempfile

          with tempfile.TemporaryDirectory(prefix="neutral-tools-no-go-") as temporary:
              tools = pathlib.Path(temporary)
              for directory in os.environ["PATH"].split(os.pathsep):
                  if not directory or not pathlib.Path(directory).is_dir():
                      continue
                  for program in pathlib.Path(directory).iterdir():
                      if program.name.startswith(("go", "gccgo")):
                          continue
                      destination = tools / program.name
                      if not destination.exists() and program.is_file() and os.access(program, os.X_OK):
                          destination.symlink_to(program.resolve())
              environment = os.environ.copy()
              environment["PATH"] = str(tools)
              environment.pop("SYMERASEME_PARITY_LIVE_GO", None)
              assert shutil.which("go", path=str(tools)) is None
              cargo = shutil.which("cargo", path=str(tools))
              assert cargo is not None
              print("Verified: go absent from PATH; default frozen suite selected", flush=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "parity", "--all-targets", "--locked", "--offline"],
                             env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--test", "identity_interop",
                              "--test", "encryption_parity", "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--lib",
                              "frozen_actual_go_and_rust_writers", "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--test", "triage_service",
                              "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--test", "projection_oversized_parity",
                              "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-engine", "--test", "scheduler_parity",
                              "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-engine", "--test", "scheduler_install_parity",
                              "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--test", "config_parity",
                              "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--test", "campaign_execution_oracle",
                              "--test", "campaign_plan_contract", "--locked", "--offline"], env=environment, check=True)
              subprocess.run([cargo, "+1.98.0", "test", "-p", "symeraseme-core", "--test", "sqlite_contract",
                              "--locked", "--offline"], env=environment, check=True)
          PY
