name: Plain-store switchback

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plain-store-switchback-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: go1.26.6
  GOWORK: 'off'
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_TERM_COLOR: never

jobs:
  plain-store-switchback:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Prepare isolated paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/switchback-tmp" "$RUNNER_TEMP/switchback-logs" "$RUNNER_TEMP/switchback-binaries"
          printf 'TMPDIR=%s\nCARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/switchback-tmp" "$RUNNER_TEMP/switchback-target" >> "$GITHUB_ENV"
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Prepare isolated build and record source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > "$RUNNER_TEMP/switchback-logs/source-revision.txt"
          git status --porcelain=v1 > "$RUNNER_TEMP/switchback-logs/source-before.txt"
          test ! -s "$RUNNER_TEMP/switchback-logs/source-before.txt"
          python3 --version
          rustup show active-toolchain
          cargo --version
          go env GOVERSION CGO_ENABLED GOOS GOARCH > "$RUNNER_TEMP/switchback-logs/go-env.txt"
      - name: Execute harness rejection and cleanup controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s rust-tests/parity -p test_plain_store_switchback.py -v 2>&1 | tee "$RUNNER_TEMP/switchback-logs/controls.log"
      - name: Build both implementations from the candidate
        shell: bash
        run: |
          set -euo pipefail
          go build -mod=readonly -trimpath -buildvcs=true -o "$RUNNER_TEMP/switchback-binaries/go" ./cmd/symeraseme 2>&1 | tee "$RUNNER_TEMP/switchback-logs/go-build.log"
          go version -m "$RUNNER_TEMP/switchback-binaries/go" > "$RUNNER_TEMP/switchback-logs/go-build-info.txt"
          python3 -c 'from pathlib import Path; import sys; settings={line.strip() for line in Path(sys.argv[1]).read_text().splitlines()}; revision=Path(sys.argv[2]).read_text().strip(); assert {"build\tvcs.revision="+revision,"build\tvcs.modified=false"} <= settings, "Go artifact does not match the clean checkout"' "$RUNNER_TEMP/switchback-logs/go-build-info.txt" "$RUNNER_TEMP/switchback-logs/source-revision.txt"
          cargo build --locked -p symeraseme-cli --bin symeraseme-rust 2>&1 | tee "$RUNNER_TEMP/switchback-logs/rust-build.log"
      - name: Execute all six real switchback cases
        shell: bash
        run: |
          set -euo pipefail
          python3 rust-tests/parity/plain_store_switchback.py --go "$RUNNER_TEMP/switchback-binaries/go" --rust "$CARGO_TARGET_DIR/debug/symeraseme-rust" --go-tool "$(command -v go)" --output-dir "$RUNNER_TEMP/switchback-evidence" | tee "$RUNNER_TEMP/switchback-logs/result.log"
          git status --porcelain=v1 > "$RUNNER_TEMP/switchback-logs/source-after.txt"
          test ! -s "$RUNNER_TEMP/switchback-logs/source-after.txt"
      - name: Retain raw observations even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plain-store-switchback-macos-${{ github.sha }}
          path: |
            ${{ runner.temp }}/switchback-logs
            ${{ runner.temp }}/switchback-evidence
          if-no-files-found: error
          retention-days: 30
