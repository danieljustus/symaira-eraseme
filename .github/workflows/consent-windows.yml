name: Native Windows consent filesystem

on:
  pull_request:
    paths:
      - crates/symeraseme-core/src/identity/**
      - crates/symeraseme-core/tests/consent_windows_acl.rs
      - crates/symeraseme-core/tests/consent_api.rs
      - crates/symeraseme-core/tests/support/consent_acl.ps1
      - crates/symeraseme-core/tests/support/frozen_consent_acl.rs
      - tests/fixtures/go-frozen/refresh-a3db5a02/consent-acl/**
      - scripts/capture-windows-identity.ps1
      - rust-tests/parity/oracle/consent-windows-acl/**
      - rust-tests/parity/cases/consent-filesystem/**
      - internal/identity/**
      - go.mod
      - go.sum
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/consent-windows.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: consent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-consent:
    name: Consent filesystem / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Authenticate retained source objects, never build Go.
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Capture independent native identity for Rust replay
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'consent-replay-identity/baseline.json'
          ./scripts/capture-windows-identity.ps1 -Mode Capture -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact
      - name: Rust-only consent bytes and inherited DACL replay
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'consent-replay-identity/baseline.json'
          $env:SYMERASEME_WINDOWS_IDENTITY_BASELINE = $artifact
          $replay = @'
          set -euo pipefail
          log="$RUNNER_TEMP/consent-replay.log"
          cargo +1.98.0 test -p symeraseme-core --locked --test consent_windows_acl \
            -- --exact native_consent_files_and_dacls_match_recorded_go --nocapture 2>&1 | tee "$log"
          grep -Eq '^running 1 test$' "$log"
          grep -Eq '^test native_consent_files_and_dacls_match_recorded_go \.\.\.' "$log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$log"
          for case in inherited owner-only-parent readonly-directory readonly-token; do
            grep -Fq "native consent $case: retained Go bytes, full security descriptor and sentinel matched by Rust" "$log"
          done
          '@
          ./scripts/capture-windows-identity.ps1 -Mode Verify -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact -BashScript $replay
          exit $LASTEXITCODE
      - name: Retain Rust consent replay diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consent-replay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/consent-replay.log
          if-no-files-found: error
          retention-days: 7
      - name: Real kernel close failure and open-old-file rollback
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked --lib windows_filesystem_tests -- --nocapture
      - name: Consent API and portable cleanup controls
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked --test consent_api -- --nocapture
          cargo +1.98.0 test -p symeraseme-core --locked --lib portable_filesystem_tests -- --nocapture
