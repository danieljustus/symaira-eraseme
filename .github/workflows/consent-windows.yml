name: Native Windows consent filesystem

on:
  pull_request:
    paths:
      - crates/symeraseme-core/src/identity/**
      - crates/symeraseme-core/tests/consent_windows_acl.rs
      - crates/symeraseme-core/tests/consent_api.rs
      - crates/symeraseme-core/tests/support/consent_acl.ps1
      - rust-tests/parity/oracle/consent-windows-acl/**
      - rust-tests/parity/cases/consent-filesystem/**
      - internal/identity/**
      - go.mod
      - go.sum
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/consent-windows.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: consent-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-consent:
    name: Consent filesystem / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Download pinned Go modules
        shell: bash
        run: GOTOOLCHAIN=go1.26.9 go mod download
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Real Go consent bytes and inherited DACLs
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked --test consent_windows_acl \
            -- --exact native_consent_files_and_dacls_match_checked_out_go --nocapture
      - name: Real kernel close failure and open-old-file rollback
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked --lib windows_filesystem_tests -- --nocapture
      - name: Consent API and portable Go cleanup controls
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked --test consent_api -- --nocapture
          cargo +1.98.0 test -p symeraseme-core --locked --lib portable_filesystem_tests -- --nocapture
