name: Required CLI checks (Rust)

# Historical check names stay required by the main protection ruleset.
# Keep their names but execute Rust gates, without installing a Go toolchain.
on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'rust-tests/**'
      - 'Makefile'
      - 'scripts/check-rust-coverage.sh'
      - 'scripts/prepare-frozen-history.py'
      - 'tests/test_prepare_frozen_history.py'
      - 'tests/test_make_rust_contract.py'
      - '.github/workflows/go-ci.yml'
  pull_request:
    branches: [main]
    # Required checks must execute even on documentation-only pull requests.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_INCREMENTAL: '0'

jobs:
  go-lint:
    name: Go / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint
      - name: Check Make and coverage failure controls
        run: |
          python3 -B tests/test_make_rust_contract.py
          python3 -B -O tests/test_make_rust_contract.py
          python3 -B tests/test_prepare_frozen_history.py
          python3 -B -O tests/test_prepare_frozen_history.py

  go-test:
    name: Go / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain and coverage
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview
          cargo +"$RUST_TOOLCHAIN" install cargo-llvm-cov --version 0.9.0 --locked
      - name: Prepare immutable frozen producer history
        run: python3 scripts/prepare-frozen-history.py --fetch
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Coverage gate
        run: make coverage COVERAGE_FILE="$RUNNER_TEMP/coverage.json"