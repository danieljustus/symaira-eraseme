name: Go CI

# Go-only CI for the static symeraseme CLI. The macOS GUI is built and verified
# by the tag-triggered release workflow.
on:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - '**.go'
      - 'Makefile'
      - '.golangci.yml'
      - 'cmd/**'
      - 'internal/**'
  pull_request:
    branches: [main]
    # No paths filter on pull requests: both CI legs must run on every PR
    # (issue #710), so the Python tree gets continuous Go-leg feedback and
    # the Go leg cannot silently skip.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'
  CGO_ENABLED: '0'

jobs:
  go-lint:
    name: Go / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check formatting
        run: make fmt-check
      - name: Lint
        run: make lint

  go-test:
    name: Go / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Coverage gate
        run: make coverage COVERAGE_FILE="$RUNNER_TEMP/coverage.out"