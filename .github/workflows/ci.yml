name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '33 5 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  icon-compile:
    name: app icon compile
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '26.4.1'
      - name: Verify Xcode toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          echo "$XCODE_VERSION"
          XCODE_MAJOR="${XCODE_VERSION#Xcode }"
          XCODE_MAJOR="${XCODE_MAJOR%%.*}"
          if ! [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]] || (( XCODE_MAJOR < 26 )); then
            echo "::error::Expected Xcode 26 or newer, got: $XCODE_VERSION" >&2
            exit 1
          fi
      - name: Compile and inspect native icon
        run: ./scripts/test-app-icon.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Install golangci-lint
        # Without this the lint target would fall back to `go vet` and the
        # linters configured in .golangci.yml would never run.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Check formatting and lint
        run: |
          make fmt-check
          make lint

  test:
    name: test (3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Build and test
        run: |
          make build
          make test
          make test-race

  schema-validate:
    name: schema-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Validate embedded registry
        run: |
          make build
          ./symeraseme registry validate

  vuln-scan:
    name: vuln-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Audit Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          # action.yml constructs IMAGE:VERSION; tag@digest keeps the
          # 3.97.5 label while pinning the manifest immutably.
          image: ghcr.io/trufflesecurity/trufflehog
          version: '3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076'
          extra_args: --exclude-detectors Lob --exclude-paths .trufflehog-exclude-paths --fail-on-scan-errors
      - name: TruffleHog protected-history scan
        uses: trufflesecurity/trufflehog@f714bf454f350590f4a24c3ddb1aef02c35bf5b6 # v3.97.5
        with:
          path: ./
          image: ghcr.io/trufflesecurity/trufflehog
          version: '3.97.5@sha256:1cec88f18ca39e26e04e61fe9d886c9c4e5f2fc0ba4f2ed185cac0722bd8a076'
          # --since-commit excludes its base commit. Starting at the known
          # fixture commit therefore scans the scanner-safe remediation and
          # every later revision of the one path omitted above.
          base: fa366dcabb830af478c44c372c2ca40395654644
          head: HEAD
          extra_args: --exclude-detectors Lob --include-paths .trufflehog-include-paths --fail-on-scan-errors
      - name: Verify protected-scope TruffleHog coverage
        run: ./scripts/test-trufflehog-scope.sh
