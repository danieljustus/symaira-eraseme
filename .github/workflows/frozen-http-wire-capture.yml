name: Native frozen HTTP wire replay

on:
  pull_request:
    paths:
      - crates/symeraseme-cli/tests/mcp_http_process.rs
      - crates/symeraseme-cli/tests/support/interrupted_read.rs
      - crates/symeraseme-cli/tests/support/capture_http_wire.rs
      - .github/workflows/frozen-http-wire-capture.yml
      - scripts/prepare-frozen-history.py
      - tests/test_prepare_frozen_history.py
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: frozen-http-wire-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Frozen HTTP wire / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare immutable frozen producer history
        run: python3 scripts/prepare-frozen-history.py --fetch
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify clean replay source
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Read interruption controls and original real Rust HTTP parent
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --test mcp_http_process --locked interrupted_read -- --nocapture
          cargo +1.98.0 test -p symeraseme-cli --test mcp_http_process --locked http_process_matches_core_contract_rotates_token_and_shuts_down_on_signals -- --exact --nocapture
      - name: Replay all ten frozen comparisons through Rust
        shell: bash
        env:
          SYMERASEME_PARITY_LIVE_GO: '0'
        run: |
          set -euo pipefail
          cargo +1.98.0 test -p symeraseme-cli --test mcp_http_process --locked go_oracle_http_wire_transcripts_match -- --exact --nocapture \
            2>&1 | tee "$RUNNER_TEMP/frozen-http-wire-replay.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/frozen-http-wire-replay.log"
      - name: Retain native Rust wire replay diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frozen-http-wire-replay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/frozen-http-wire-replay.log
          if-no-files-found: error
          retention-days: 30
