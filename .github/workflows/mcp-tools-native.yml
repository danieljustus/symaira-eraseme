name: Native MCP tool byte parity

on:
  pull_request:
    paths:
      - crates/symeraseme-cli/src/mcp/**
      - crates/symeraseme-cli/src/store.rs
      - crates/symeraseme-cli/tests/mcp_stdio_process.rs
      - crates/symeraseme-cli/tests/triage_native_process.rs
      - crates/symeraseme-core/src/reporting.rs
      - crates/symeraseme-core/src/registry/**
      - internal/mcp/**
      - internal/reporting/**
      - rust-tests/parity/oracle/mcp-*/**
      - rust-tests/parity/oracle/native-triage-agent/**
      - tests/fixtures/mcp-*/**
      - tests/fixtures/cli-triage/**
      - go.mod
      - go.sum
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/mcp-tools-native.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mcp-tools-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tools:
    name: MCP tools / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Download pinned Go modules
        shell: bash
        run: GOTOOLCHAIN=go1.26.6 go mod download
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Handler results, complete current-Go bytes and envelope/error markers
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked --bin symeraseme-rust mcp:: -- --nocapture
      - name: Real stdio campaign, scheduler and parser cases
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked --test mcp_stdio_process -- --nocapture
      - name: Compiled native agent, raw triage responses and saved effects
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked --test triage_native_process -- --nocapture
