name: Capture native consent ACL originals

# Manual, opt-in capture of ORIGINAL Go consent observations on native Windows.
# No push/PR trigger; the parent dispatches and inspects this run.

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: capture-consent-retirement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture consent ACL originals / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Download pinned Go modules
        shell: bash
        run: |
          set -euo pipefail
          GOTOOLCHAIN=go1.26.6 go mod download
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Capture trusted Windows identity baseline
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'identity-baseline/windows-identity-baseline.json'
          ./scripts/capture-windows-identity.ps1 -Mode Capture -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact
      - name: Upload trusted Windows identity baseline
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-identity-baseline-${{ matrix.os }}
          path: ${{ runner.temp }}/identity-baseline/windows-identity-baseline.json
          retention-days: 7
          if-no-files-found: error
      - name: Capture real Go consent observations
        id: capture
        shell: pwsh
        timeout-minutes: 25
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
          SYMERASEME_CAPTURE_CONSENT_ACL: ${{ runner.temp }}/consent-capture
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'identity-baseline/windows-identity-baseline.json'
          $captureScript = @'
          set -euo pipefail
          mkdir -p "${SYMERASEME_CAPTURE_CONSENT_ACL}"
          log="${RUNNER_TEMP}/consent-test.log"
          set +e
          cargo +1.98.0 test -p symeraseme-core --locked --test consent_windows_acl \
            -- --exact native_consent_files_and_dacls_match_checked_out_go --nocapture 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            echo "consent capture test failed (exit ${status}); no success is recorded" >&2
            exit "${status}"
          fi
          grep -Eq '^running 1 test$' "${log}"
          grep -Eq 'test result: ok\. 1 passed; 0 failed' "${log}"
          test -s "${SYMERASEME_CAPTURE_CONSENT_ACL}/consent-windows-acl.json"
          echo "executed-test guard: 1 exact test passed; artifact present"
          '@
          ./scripts/capture-windows-identity.ps1 -Mode Verify -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact -BashScript $captureScript
          exit $LASTEXITCODE
      - name: Upload native raw originals
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consent-windows-acl-${{ matrix.os }}
          path: ${{ runner.temp }}/consent-capture/consent-windows-acl.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consent-windows-acl-diagnostics-${{ matrix.os }}
          path: ${{ runner.temp }}/consent-test.log
          retention-days: 7
          if-no-files-found: warn
