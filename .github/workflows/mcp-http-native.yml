name: Native MCP HTTP platform parity

on:
  pull_request:
    paths:
      - crates/symeraseme-cli/src/mcp/**
      - crates/symeraseme-cli/tests/mcp_http*.rs
      - crates/symeraseme-cli/tests/support/mcp_*
      - crates/symeraseme-cli/tests/frozen_http_aux.rs
      - crates/symeraseme-cli/tests/support/*_http_aux.rs
      - crates/symeraseme-cli/tests/support/frozen_token_acl.rs
      - crates/symeraseme-cli/tests/support/frozen_windows_http.rs
      - crates/symeraseme-cli/tests/support/native_host_agent.rs
      - crates/symeraseme-cli/tests/fixtures/native_host_agent.rs
      - crates/symeraseme-cli/tests/windows_http_capture_contract.rs
      - tests/fixtures/go-frozen/refresh-735ae51e/windows-http/**
      - tests/fixtures/go-frozen/refresh-a3db5a02/token-acl/**
      - scripts/capture-windows-identity.ps1
      - cmd/symeraseme/**
      - internal/mcp/**
      - scripts/check-mcp-conformance.py
      - scripts/test_check_mcp_conformance.py
      - scripts/mcp-conformance-auth.mjs
      - go.mod
      - go.sum
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/mcp-http-native.yml
  workflow_dispatch:
    inputs:
      replay_token_acl:
        description: Replay retained Windows token ACL observations using Rust only
        type: boolean
        default: false
      replay_windows_http:
        description: Replay retained Windows HTTP process observations with Go unavailable
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcp-http-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  official-core:
    if: github.event_name != 'workflow_dispatch' || !(inputs.replay_token_acl || inputs.replay_windows_http)
    name: Official MCP core / Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: modelcontextprotocol/conformance
          ref: 21a9a2febd7100d7c17ac1021ee7f2ed9f66a1e0 # 0.1.16, immutable upstream source
          path: official-conformance
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
      - name: Build pinned official conformance CLI
        working-directory: official-conformance
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build actual Rust product
        working-directory: product
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/mcp-conformance-target" cargo +1.98.0 build -p symeraseme-cli --bin symeraseme-rust --locked
      - name: Verify conformance acceptance controls
        working-directory: product
        shell: bash
        run: |
          python3 -B scripts/test_check_mcp_conformance.py
          python3 -B -O scripts/test_check_mcp_conformance.py
      - name: Official applicable core scenarios with private authenticated servers
        working-directory: product
        shell: bash
        run: |
          python3 scripts/check-mcp-conformance.py \
            --conformance ../official-conformance \
            --rust "$RUNNER_TEMP/mcp-conformance-target/debug/symeraseme-rust" \
            --output "$RUNNER_TEMP/mcp-conformance-result"
      - name: Retain source-bound official check receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-mcp-core
          path: ${{ runner.temp }}/mcp-conformance-result/manifest.json
          if-no-files-found: warn
          retention-days: 7
  native-mcp:
    name: MCP HTTP / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (inputs.replay_token_acl || inputs.replay_windows_http) && fromJSON('["windows-2025","windows-11-arm"]') || fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","macos-14","macos-15-intel","windows-2025","windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Frozen native readers verify immutable source and generator blobs.
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Complete response headers, raw bodies and native bind failures
        if: github.event_name != 'workflow_dispatch' || !(inputs.replay_token_acl || inputs.replay_windows_http)
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked \
            --test mcp_http_headers_process --test mcp_http_native_contract --test frozen_http_aux \
            -- --nocapture --skip windows_acl::native_windows_token_dacl_and_rotation_match_go
      - name: Native Windows console, auth, rotation, timeout and disconnect contracts
        if: runner.os == 'Windows' && (!inputs.replay_token_acl || inputs.replay_windows_http)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = ($env:PATH.Split([IO.Path]::PathSeparator) | Where-Object {
            $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'go.exe'))
          }) -join [IO.Path]::PathSeparator
          if (Get-Command go,go.exe -CommandType Application -ErrorAction SilentlyContinue) {
            throw 'Go must be unavailable during the Rust-only replay'
          }
          $replayScript = @'
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test -z "$(git status --porcelain)"
          if command -v go >/dev/null 2>&1; then
            printf 'Go unexpectedly resolves in the replay shell\n' >&2
            exit 1
          fi
          cargo +1.98.0 test -p symeraseme-cli --locked --test windows_http_capture_contract \
            2>&1 | tee "$RUNNER_TEMP/windows-http-reader.log"
          grep -Eq '^running [1-9][0-9]* tests?$' "$RUNNER_TEMP/windows-http-reader.log"
          tests=(
            native_windows_http_matches_checked_out_go
            native_windows_disconnect_reaps_host_agent_like_go
            native_windows_pathext_availability_matches_live_go
            native_windows_disconnect_cancels_provider_request_like_go
            native_windows_slow_header_timeout_matches_go
            native_windows_ctrl_break_shutdown_matches_go
            native_windows_ctrl_c_shutdown_matches_go
          )
          cargo +1.98.0 test -p symeraseme-cli --locked --test mcp_http_windows_process \
            -- "${tests[@]}" --exact --nocapture --test-threads=1 \
            2>&1 | tee "$RUNNER_TEMP/windows-http-replay.log"
          grep -Eq '^running 7 tests$' "$RUNNER_TEMP/windows-http-replay.log"
          grep -Eq 'test result: ok\. 7 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/windows-http-replay.log"
          test -z "$(git status --porcelain)"
          '@
          & bash --noprofile --norc -c $replayScript
          exit $LASTEXITCODE
      - name: Retain Windows HTTP replay diagnostics
        if: always() && runner.os == 'Windows' && (!inputs.replay_token_acl || inputs.replay_windows_http)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-http-replay-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/windows-http-reader.log
            ${{ runner.temp }}/windows-http-replay.log
          if-no-files-found: error
          retention-days: 7
      - name: Native Unix process and signal contracts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked --test mcp_http_process -- --nocapture
      - name: Capture trusted Windows identity baseline
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'identity-baseline/windows-identity-baseline.json'
          ./scripts/capture-windows-identity.ps1 -Mode Capture -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact
      - name: Rust-only native token ACL and rotation replay
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'identity-baseline/windows-identity-baseline.json'
          $env:SYMERASEME_WINDOWS_IDENTITY_BASELINE = $artifact
          $replayScript = @'
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test -z "$(git status --porcelain)"
          cargo +1.98.0 test -p symeraseme-cli --locked --test mcp_http_native_contract \
            -- --exact windows_acl::native_windows_token_dacl_and_rotation_match_go --nocapture \
            2>&1 | tee "$RUNNER_TEMP/token-acl-replay.log"
          grep -Eq '^running 1 test$' "$RUNNER_TEMP/token-acl-replay.log"
          grep -Eq '^test windows_acl::native_windows_token_dacl_and_rotation_match_go \.\.\.' "$RUNNER_TEMP/token-acl-replay.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/token-acl-replay.log"
          grep -Fq 'Windows token ACL replay executed inherited and owner-only-parent cases against actual Rust' "$RUNNER_TEMP/token-acl-replay.log"
          '@
          ./scripts/capture-windows-identity.ps1 -Mode Verify -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact -BashScript $replayScript
          exit $LASTEXITCODE
      - name: Retain token replay diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-acl-replay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/token-acl-replay.log
          if-no-files-found: error
          retention-days: 7
