name: Native reply triage parity

on:
  pull_request:
    paths:
      - crates/symeraseme-core/src/triage*
      - crates/symeraseme-core/tests/triage*
      - crates/symeraseme-cli/src/commands/classify_reply.rs
      - crates/symeraseme-cli/src/commands/generate_rebuttal.rs
      - crates/symeraseme-cli/tests/triage*
      - crates/symeraseme-cli/tests/mcp_triage_process.rs
      - crates/symeraseme-cli/tests/command_surface.rs
      - crates/symeraseme-cli/tests/support/*migration*.rs
      - tests/fixtures/go-frozen/refresh-8973a584/windows-migration/**
      - rust-tests/parity/oracle/native-triage-agent/**
      - tests/fixtures/cli-triage/**
      - go.mod
      - go.sum
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/triage-native.yml
      - scripts/prepare-frozen-history.py
      - tests/test_prepare_frozen_history.py
  workflow_dispatch:
    inputs:
      replay_windows_migration:
        description: Replay retained Windows CLI and migration records using Rust only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: triage-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-triage:
    name: Reply triage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.replay_windows_migration && fromJSON('["windows-2025","windows-11-arm"]') || fromJSON('["ubuntu-24.04","ubuntu-24.04-arm","macos-14","macos-15-intel","windows-2025","windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Retained readers authenticate immutable historical source objects.
          fetch-depth: 0
      - name: Prepare immutable frozen producer history
        shell: bash
        run: python3 scripts/prepare-frozen-history.py --fetch
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Source-bound mapping, prompts, persisted service and IMAP transcripts
        if: github.event_name != 'workflow_dispatch' || !inputs.replay_windows_migration
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked \
            --test triage_contract --test triage_prompts --test triage_corpus \
            --test triage_service --test imap_transport_parity -- --nocapture
      - name: Every retained CLI triage input and raw MCP process effects
        if: github.event_name != 'workflow_dispatch' || !inputs.replay_windows_migration
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked --test triage_native_process -- --nocapture
      - name: Retained Unix shell-agent fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked \
            --test triage_commands --test mcp_triage_process -- --nocapture
      - name: Full retained CLI corpus including poll-inbox aliases and errors
        if: github.event_name != 'workflow_dispatch' || !inputs.replay_windows_migration
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-cli --locked --test command_surface \
            -- --exact frozen_command_surface_matches_phase_two_contract --nocapture
      - name: Rust-only Windows CLI and filesystem replay
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Windows
          test -z "$(git status --porcelain)"
          cargo +1.98.0 test -p symeraseme-cli --locked --test command_surface \
            -- --exact frozen_command_surface_matches_phase_two_contract \
            migration_oracle::migration_filesystem_matches_recorded_native_go \
            --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/windows-migration-replay.log"
          grep -Eq '^running 2 tests$' "$RUNNER_TEMP/windows-migration-replay.log"
          grep -Eq 'test result: ok\. 2 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/windows-migration-replay.log"
          grep -Eq '^test frozen_command_surface_matches_phase_two_contract .*ok$' "$RUNNER_TEMP/windows-migration-replay.log"
          grep -Eq '^test migration_oracle::migration_filesystem_matches_recorded_native_go \.\.\.' "$RUNNER_TEMP/windows-migration-replay.log"
      - name: Retain Windows migration replay diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-migration-replay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/windows-migration-replay.log
          if-no-files-found: error
          retention-days: 7
