name: Native email platform trust

on:
  pull_request:
    paths:
      - crates/symeraseme-core/src/email/**
      - crates/symeraseme-core/tests/oauth2_platform_trust.rs
      - crates/symeraseme-core/tests/support/imap_server.rs
      - .github/workflows/email-native-trust.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: email-native-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-trust:
    name: Native email trust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Private CA in the real OS store with negative TLS controls
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --test oauth2_platform_trust --locked -- \
            --ignored --exact native_platform_roots_accept_ca_and_reject_foreign_expired_chains --nocapture
      - name: Source-bound mailbox and OAuth2 transcript parity
        shell: bash
        run: |
          cargo +1.98.0 test -p symeraseme-core --locked \
            --test email_parity --test imap_transport_parity --test oauth2_parity
