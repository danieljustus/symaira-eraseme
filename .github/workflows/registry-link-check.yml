name: Registry Link Check

on:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync
      - name: Check broker website URLs
        run: |
          uv run python -c "
          import sys, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          import yaml

          urls = []
          for yml in sorted(Path('registry/brokers').rglob('*.yaml')):
              with open(yml) as f:
                  data = yaml.safe_load(f)
              status = data.get('status', 'active')
              name = data.get('name', yml.stem)
              if status != 'active':
                  print(f'  - {name} — skipped (status: {status})')
                  continue
              url = data.get('website', '')
              urls.append((name, url))

          data_errors: list[str] = []
          link_errors: list[str] = []
          checked = 0

          def check(name: str, url: str) -> tuple[str, str, str]:
              try:
                  if not url.startswith(('http://', 'https://')) or any(c.isspace() for c in url):
                      return (name, 'data_err', f'{name}: malformed website URL in registry data — {url!r}')
                  req = Request(url, method='HEAD')
                  req.add_header('User-Agent', 'Symaira EraseMe-LinkCheck/0.1')
                  urlopen(req, timeout=10)
                  return (name, 'ok', f'  \u2713 {name} \u2014 {url}')
              except HTTPError as e:
                  if e.code == 403:
                      return (name, 'skip', f'  ~ {name} \u2014 {url} (HTTP {e.code}, skipping)')
                  return (name, 'link_err', f'{name}: HTTP {e.code} \u2014 {url}')
              except (URLError, ValueError, OSError) as e:
                  return (name, 'link_err', f'{name}: {e} \u2014 {url}')
              except Exception as e:  # safety net: a single bad entry must not crash the run
                  return (name, 'link_err', f'{name}: unexpected {type(e).__name__}: {e} \u2014 {url}')

          with ThreadPoolExecutor(max_workers=30) as executor:
              futures = {executor.submit(check, n, u): n for n, u in urls}
              for future in as_completed(futures):
                  name, status, msg = future.result()
                  checked += 1
                  print(msg)
                  if status == 'data_err':
                      data_errors.append(msg)
                  elif status == 'link_err':
                      link_errors.append(msg)
                  if checked % 50 == 0:
                      time.sleep(0.2)

          # Unreachable external sites are informational (transient downtime,
          # defunct brokers) and do not fail the run; malformed registry data does.
          if link_errors:
              print(f'\n{len(link_errors)} site(s) unreachable (informational):')
              for e in link_errors:
                  print(f'  - {e}')
          if data_errors:
              print(f'\n{len(data_errors)} malformed website URL(s) in registry data:')
              for e in data_errors:
                  print(f'  - {e}')
              sys.exit(1)
          "
