name: Publish Homebrew Formula

on:
  # `released` fires for a stable release and when a prerelease is promoted,
  # never for a canary prerelease, so Homebrew users only receive stable builds.
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish (for example, v0.12.1)"
        required: true
        type: string
      dry_run:
        description: "Render and install-test the formula without pushing it to the tap"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: homebrew-symeraseme-formula
  cancel-in-progress: false

jobs:
  publish:
    name: Update Homebrew CLI Formula
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Validate release and publisher credential
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Invalid release tag: $RELEASE_TAG"; exit 1 ;;
          esac
          if [ "${DRY_RUN:-false}" != true ] && [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not configured."
            exit 1
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: danieljustus/homebrew-tap
          # The public tap is only read in a dry run; the write token is used to publish.
          token: ${{ inputs.dry_run && github.token || secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
          fetch-depth: 0

      - name: Download and verify CLI archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          mkdir -p "$RUNNER_TEMP/symeraseme-assets"
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="$RUNNER_TEMP/symeraseme-assets/symeraseme_${VERSION}_${target}.tar.gz"
            curl --fail --silent --show-error --location \
              "$BASE_URL/symeraseme_${VERSION}_${target}.tar.gz" \
              --output "$archive"
            tar -tzf "$archive" | grep -Fx 'symeraseme' >/dev/null
            test "$(tar -tzf "$archive" | LC_ALL=C sort)" = "$(printf '%s\n' LICENSE README.md symeraseme | LC_ALL=C sort)"
            sha256sum "$archive"
          done

      - name: Render and validate Formula
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          ASSET_DIR="$RUNNER_TEMP/symeraseme-assets"
          ARM_DARWIN_SHA=$(sha256sum "$ASSET_DIR/symeraseme_${VERSION}_darwin_arm64.tar.gz" | cut -d' ' -f1)
          AMD_DARWIN_SHA=$(sha256sum "$ASSET_DIR/symeraseme_${VERSION}_darwin_amd64.tar.gz" | cut -d' ' -f1)
          ARM_LINUX_SHA=$(sha256sum "$ASSET_DIR/symeraseme_${VERSION}_linux_arm64.tar.gz" | cut -d' ' -f1)
          AMD_LINUX_SHA=$(sha256sum "$ASSET_DIR/symeraseme_${VERSION}_linux_amd64.tar.gz" | cut -d' ' -f1)
          FORMULA="tap/Formula/symeraseme.rb"
          mkdir -p "$(dirname "$FORMULA")"
          cat > "$FORMULA" <<EOF
          # typed: false
          # frozen_string_literal: true

          class Symeraseme < Formula
            desc "Automated GDPR/CCPA data broker removal CLI"
            homepage "https://github.com/danieljustus/symaira-eraseme"
            version "$VERSION"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "$BASE_URL/symeraseme_${VERSION}_darwin_arm64.tar.gz"
                sha256 "$ARM_DARWIN_SHA"
              else
                url "$BASE_URL/symeraseme_${VERSION}_darwin_amd64.tar.gz"
                sha256 "$AMD_DARWIN_SHA"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "$BASE_URL/symeraseme_${VERSION}_linux_arm64.tar.gz"
                sha256 "$ARM_LINUX_SHA"
              else
                url "$BASE_URL/symeraseme_${VERSION}_linux_amd64.tar.gz"
                sha256 "$AMD_LINUX_SHA"
              end
            end

            def install
              bin.install "symeraseme"
            end

            test do
              system "#{bin}/symeraseme", "version"
            end
          end
          EOF
          ruby -c "$FORMULA"
          git -C tap diff --check
          grep -q "version \"$VERSION\"" "$FORMULA"

      - name: Retain the rendered Formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-formula
          path: tap/Formula/symeraseme.rb
          if-no-files-found: error
          retention-days: 7

      - name: Publish updated Formula
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/symeraseme.rb
          if git -C tap diff --cached --quiet; then
            echo "Formula already matches release $RELEASE_TAG."
            exit 0
          fi
          git -C tap commit -m "Update symeraseme to $RELEASE_TAG"
          git -C tap push origin main
          git -C tap ls-remote origin refs/heads/main

  install-check:
    name: Install rendered Formula / ${{ matrix.os }}
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@dc7099b3e807f1e2ecc61f3ecabc840eedd5586a # main
      - name: Download the rendered Formula
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: homebrew-formula
          path: ${{ runner.temp }}/formula
      - name: Install from a disposable local tap and run the formula test
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew tap-new --no-git local/symeraseme-check
          cp "$RUNNER_TEMP/formula/symeraseme.rb" "$(brew --repository local/symeraseme-check)/Formula/"
          brew install --formula local/symeraseme-check/symeraseme
          brew test local/symeraseme-check/symeraseme
          prefix="$(brew --prefix)"
          version="${RELEASE_TAG#v}"
          test "$("$prefix/bin/symeraseme" --version)" = "symeraseme version $version"
          test ! -e "$prefix/bin/symeraseme-go"
    env:
      RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
