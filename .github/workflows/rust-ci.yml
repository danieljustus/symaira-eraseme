name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  rust-pr:
    name: Rust / PR fast gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Cache Rust verification tools
        id: rust_tools_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/erase-me-cargo-install-root
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-nextest-0.9.143-audit-0.22.2-deny-0.20.2-hack-0.6.45-llvm-cov-0.9.0

      - name: Install Rust verification tools on cache miss
        if: steps.rust_tools_cache.outputs.cache-hit != 'true'
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/erase-me-cargo-install-root
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" install cargo-nextest --version 0.9.143 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-audit --version 0.22.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-hack --version 0.6.45 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-llvm-cov --version 0.9.0 --locked

      - name: Add Rust verification tools to PATH
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/erase-me-cargo-install-root
        shell: bash
        run: echo "$CARGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"

      - name: Format
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all --check

      - name: Check
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked

      - name: Clippy with warnings denied
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" nextest run --workspace --all-features --locked

      - name: Doctests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked

      - name: Rust line coverage gate
        shell: bash
        run: |
          set -euo pipefail
          critical_pattern='/(crypto|consent|auth|mcp)(/|\.rs$)'
          # A module file that only declares children and re-exports emits no code,
          # so LLVM coverage can never report measurable lines for it. Such
          # declaration-only facades are excluded from the expectation set and
          # announced. Any file containing a code-bearing item stays critical, so a
          # genuinely uninstrumented crypto/consent/auth/MCP module still fails.
          code_item_pattern='^[[:space:]]*(pub([[:space:]]*\([^)]*\))?[[:space:]]+)?(async[[:space:]]+|unsafe[[:space:]]+|const[[:space:]]+)?(fn|impl|trait|struct|enum|union|const|static|type|macro_rules!|extern)([^[:alnum:]_]|$)'
          critical_files=()
          declaration_only=()
          while IFS= read -r file; do
            if grep -Eq "$code_item_pattern" "$file"; then
              critical_files+=("$file")
            else
              declaration_only+=("$file")
            fi
          done < <(
            find crates -type f -name '*.rs' -not -path '*/commands/*' -print |
              grep -Ei "$critical_pattern" || true
          )
          if [[ ${#declaration_only[@]} -gt 0 ]]; then
            echo "::notice::Declaration-only critical modules carry no executable lines and are excluded from the coverage expectation: ${declaration_only[*]}"
          fi
          if [[ ${#critical_files[@]} -eq 0 ]]; then
            echo '::notice::Rust coverage thresholds are fail-closed for the foundation scaffold: no first-party crypto, consent/auth, or MCP modules exist yet, so no coverage claim is reported.'
            exit 0
          fi
          coverage_json="$RUNNER_TEMP/rust-coverage.json"
          cargo +"$RUST_TOOLCHAIN" llvm-cov --workspace --all-features --json \
            --output-path "$coverage_json" --fail-under-lines 80
          python3 - "$coverage_json" 90 "${critical_files[@]}" <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path(sys.argv[1])
          threshold = float(sys.argv[2])
          expected = {(pathlib.Path.cwd() / path).resolve() for path in sys.argv[3:]}
          report = json.loads(report_path.read_text())
          data = report.get("data")
          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit("coverage report must contain exactly one data entry")
          if not isinstance(data[0], dict) or not isinstance(data[0].get("files"), list):
              raise SystemExit("coverage report has a malformed files list")
          files = {}
          for entry in data[0]["files"]:
              if not isinstance(entry, dict):
                  raise SystemExit("coverage report has a malformed file entry")
              raw_filename = entry.get("filename")
              summary = entry.get("summary")
              if not isinstance(raw_filename, str) or not raw_filename or not isinstance(summary, dict):
                  raise SystemExit("coverage report has a malformed file entry")
              lines = summary.get("lines")
              if not isinstance(lines, dict):
                  raise SystemExit("coverage report has a malformed line summary")
              count = lines.get("count")
              covered = lines.get("covered")
              if type(count) is not int or type(covered) is not int:
                  raise SystemExit("coverage report has malformed line counts")
              if count < 0 or covered < 0 or covered > count:
                  raise SystemExit("coverage report has invalid line counts")
              filename = pathlib.Path(raw_filename).resolve()
              if filename in files:
                  raise SystemExit(f"coverage report has duplicate file entry: {filename}")
              files[filename] = (count, covered)
          missing = sorted(str(path) for path in expected if path not in files)
          if missing:
              raise SystemExit(f"critical coverage files missing from report: {missing}")
          counts = [files[path] for path in expected]
          if any(count == 0 for count, _ in counts):
              raise SystemExit("critical coverage file contains no measurable lines")
          total = sum(count for count, _ in counts)
          covered = sum(value for _, value in counts)
          percent = covered * 100 / total
          print(f"Critical Rust line coverage: {percent:.2f}% ({covered}/{total}), gate: {threshold:.0f}%")
          if percent < threshold:
              raise SystemExit(1)
          PY

      - name: Upload Rust coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rust-coverage.json
            target/llvm-cov-target/*.profraw
            target/llvm-cov-target/*-profraw-list
            target/llvm-cov-target/*.profdata

      - name: Check every feature combination
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" hack check --workspace --each-feature --locked

      - name: Audit dependencies
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" audit --file Cargo.lock
          cargo +"$RUST_TOOLCHAIN" audit --file fuzz/Cargo.lock

      - name: Enforce dependency policy
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" deny check

      - name: Run neutral parity subset
        shell: bash
        run: make parity

  rust-pr-windows-clippy:
    name: Rust / PR Windows clippy
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - name: Check and lint Windows code
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

  rust-tools-cache:
    name: Rust / verification tools cache
    # The five verification tools are only needed on the pull_request path, but a
    # cache saved by a pull_request run is scoped to that pull request and cannot
    # be read by any other pull request. Seeding the identical key from the
    # default branch makes it readable by every pull request. Without this seed
    # each pull request rebuilds all five tools, which measured 10m05s of a
    # 17m19s fast gate.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust verification tools
        id: rust_tools_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/erase-me-cargo-install-root
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-nextest-0.9.143-audit-0.22.2-deny-0.20.2-hack-0.6.45-llvm-cov-0.9.0

      - name: Install Rust verification tools on cache miss
        if: steps.rust_tools_cache.outputs.cache-hit != 'true'
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/erase-me-cargo-install-root
        shell: bash
        run: |
          # Keep this list and the key above identical to the rust-pr job.
          cargo +"$RUST_TOOLCHAIN" install cargo-nextest --version 0.9.143 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-audit --version 0.22.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-hack --version 0.6.45 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-llvm-cov --version 0.9.0 --locked

  rust-native:
    name: Rust / native (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'

      - name: Download Go oracle modules
        run: go mod download

      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Format
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all --check

      - name: Check and lint
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify registry build at 1024 descriptors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test ! -e "$RUNNER_TEMP/registry-fd-target"
          (
            ulimit -n 1024
            CARGO_TARGET_DIR="$RUNNER_TEMP/registry-fd-target" CARGO_BUILD_JOBS=2 \
              cargo +"$RUST_TOOLCHAIN" check -p symeraseme-core --locked
          )

      - name: Test and doctest
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo +"$RUST_TOOLCHAIN" test --workspace --exclude parity --all-features --locked --no-fail-fast
            cargo +"$RUST_TOOLCHAIN" test --workspace --exclude parity --doc --all-features --locked
          else
            cargo +"$RUST_TOOLCHAIN" test --workspace --all-features --locked
            cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked
          fi

      - name: Run neutral parity subset on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: make parity

      - name: Record Windows parity process-tree limitation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Get-Content rust-tests/parity/src/process.rs -Raw
          if ($source -notmatch 'parity subprocess tree cleanup is unsupported on this platform') {
            throw 'The parity harness capability guard is missing or changed.'
          }
          Write-Host 'Neutral parity is intentionally excluded on Windows: process-tree cleanup requires Unix process groups; the harness fails explicitly rather than claiming tree-safe coverage.'
