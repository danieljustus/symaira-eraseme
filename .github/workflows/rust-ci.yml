name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  rust-pr:
    name: Rust / PR fast gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          go-version: '1.26.6'

      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Install Rust verification tools
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" install cargo-nextest --version 0.9.143 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-audit --version 0.22.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-hack --version 0.6.45 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-llvm-cov --version 0.9.0 --locked

      - name: Format
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all --check

      - name: Check
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked

      - name: Clippy with warnings denied
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" nextest run --workspace --all-features --locked

      - name: Doctests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked

      - name: Rust line coverage gate
        shell: bash
        run: |
          set -euo pipefail
          critical_pattern='/(crypto|consent|auth|mcp)(/|\.rs$)'
          critical_files=()
          while IFS= read -r file; do
            critical_files+=("$file")
          done < <(
            find crates -type f -name '*.rs' -not -path '*/commands/*' -print |
              grep -Ei "$critical_pattern" || true
          )
          if [[ ${#critical_files[@]} -eq 0 ]]; then
            echo '::notice::Rust coverage thresholds are fail-closed for the foundation scaffold: no first-party crypto, consent/auth, or MCP modules exist yet, so no coverage claim is reported.'
            exit 0
          fi
          coverage_json="$RUNNER_TEMP/rust-coverage.json"
          cargo +"$RUST_TOOLCHAIN" llvm-cov --workspace --all-features --json \
            --output-path "$coverage_json" --fail-under-lines 80
          python3 - "$coverage_json" 90 "${critical_files[@]}" <<'PY'
          import json
          import pathlib
          import sys

          report_path = pathlib.Path(sys.argv[1])
          threshold = float(sys.argv[2])
          expected = {(pathlib.Path.cwd() / path).resolve() for path in sys.argv[3:]}
          report = json.loads(report_path.read_text())
          data = report.get("data")
          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit("coverage report must contain exactly one data entry")
          if not isinstance(data[0], dict) or not isinstance(data[0].get("files"), list):
              raise SystemExit("coverage report has a malformed files list")
          files = {}
          for entry in data[0]["files"]:
              if not isinstance(entry, dict):
                  raise SystemExit("coverage report has a malformed file entry")
              raw_filename = entry.get("filename")
              summary = entry.get("summary")
              if not isinstance(raw_filename, str) or not raw_filename or not isinstance(summary, dict):
                  raise SystemExit("coverage report has a malformed file entry")
              lines = summary.get("lines")
              if not isinstance(lines, dict):
                  raise SystemExit("coverage report has a malformed line summary")
              count = lines.get("count")
              covered = lines.get("covered")
              if type(count) is not int or type(covered) is not int:
                  raise SystemExit("coverage report has malformed line counts")
              if count < 0 or covered < 0 or covered > count:
                  raise SystemExit("coverage report has invalid line counts")
              filename = pathlib.Path(raw_filename).resolve()
              if filename in files:
                  raise SystemExit(f"coverage report has duplicate file entry: {filename}")
              files[filename] = (count, covered)
          missing = sorted(str(path) for path in expected if path not in files)
          if missing:
              raise SystemExit(f"critical coverage files missing from report: {missing}")
          counts = [files[path] for path in expected]
          if any(count == 0 for count, _ in counts):
              raise SystemExit("critical coverage file contains no measurable lines")
          total = sum(count for count, _ in counts)
          covered = sum(value for _, value in counts)
          percent = covered * 100 / total
          print(f"Critical Rust line coverage: {percent:.2f}% ({covered}/{total}), gate: {threshold:.0f}%")
          if percent < threshold:
              raise SystemExit(1)
          PY

      - name: Check every feature combination
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" hack check --workspace --each-feature --locked

      - name: Audit dependencies
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" audit

      - name: Enforce dependency policy
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" deny check

      - name: Run neutral parity subset
        shell: bash
        run: make parity

  rust-native:
    name: Rust / native (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: true
          go-version: '1.26.6'

      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Format
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all --check

      - name: Check and lint
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test and doctest
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo +"$RUST_TOOLCHAIN" test --workspace --exclude parity --all-features --locked
            cargo +"$RUST_TOOLCHAIN" test --workspace --exclude parity --doc --all-features --locked
          else
            cargo +"$RUST_TOOLCHAIN" test --workspace --all-features --locked
            cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked
          fi

      - name: Run neutral parity subset on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: make parity

      - name: Record Windows parity process-tree limitation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Get-Content rust-tests/parity/src/process.rs -Raw
          if ($source -notmatch 'parity subprocess tree cleanup is unsupported on this platform') {
            throw 'The parity harness capability guard is missing or changed.'
          }
          Write-Host 'Neutral parity is intentionally excluded on Windows: process-tree cleanup requires Unix process groups; the harness fails explicitly rather than claiming tree-safe coverage.'
