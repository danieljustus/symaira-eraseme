name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: '1.98.0'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  SYMERASEME_PARITY_LIVE_GO: '0'

jobs:
  rust-pr:
    name: Rust / PR fast gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Cache Rust verification tools
        id: rust_tools_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/erase-me-cargo-install-root
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-nextest-0.9.143-audit-0.22.2-deny-0.20.2-hack-0.6.45-llvm-cov-0.9.0

      - name: Install Rust verification tools on cache miss
        if: steps.rust_tools_cache.outputs.cache-hit != 'true'
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/erase-me-cargo-install-root
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" install cargo-nextest --version 0.9.143 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-audit --version 0.22.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-hack --version 0.6.45 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-llvm-cov --version 0.9.0 --locked

      - name: Add Rust verification tools to PATH
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/erase-me-cargo-install-root
        shell: bash
        run: echo "$CARGO_INSTALL_ROOT/bin" >> "$GITHUB_PATH"

      - name: Format
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all --check

      - name: Check
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked

      - name: Check fuzz targets
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" check --manifest-path fuzz/Cargo.toml --bins --locked

      - name: Clippy with warnings denied
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" nextest run --workspace --all-features --locked

      - name: Doctests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked

      - name: Rust line coverage gate
        shell: bash
        run: bash scripts/check-rust-coverage.sh

      - name: Upload Rust coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rust-coverage.json
            target/llvm-cov-target/*.profraw
            target/llvm-cov-target/*-profraw-list
            target/llvm-cov-target/*.profdata

      - name: Check every feature combination
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" hack check --workspace --each-feature --locked

      - name: Audit dependencies
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" audit --file Cargo.lock
          cargo +"$RUST_TOOLCHAIN" audit --file fuzz/Cargo.lock

      - name: Enforce dependency policy
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" deny check

      - name: Run neutral parity subset
        shell: bash
        run: make parity

  rust-pr-windows-clippy:
    name: Rust / PR Windows parity and clippy
    if: github.event_name == 'pull_request'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Frozen readers authenticate immutable producer blobs.
      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
      - name: Check and lint Windows code
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Windows neutral parity tests
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test -p parity --all-features --locked --no-fail-fast
      - name: Replay native Windows MCP HTTP against frozen Go observations
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" test -p symeraseme-cli --test mcp_http_windows_process --locked -- --test-threads=1

  rust-tools-cache:
    name: Rust / verification tools cache
    # The five verification tools are only needed on the pull_request path, but a
    # cache saved by a pull_request run is scoped to that pull request and cannot
    # be read by any other pull request. Seeding the identical key from the
    # default branch makes it readable by every pull request. Without this seed
    # each pull request rebuilds all five tools, which measured 10m05s of a
    # 17m19s fast gate.
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - name: Cache Rust verification tools
        id: rust_tools_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/erase-me-cargo-install-root
          key: rust-tools-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-nextest-0.9.143-audit-0.22.2-deny-0.20.2-hack-0.6.45-llvm-cov-0.9.0

      - name: Install Rust verification tools on cache miss
        if: steps.rust_tools_cache.outputs.cache-hit != 'true'
        env:
          CARGO_INSTALL_ROOT: ${{ runner.temp }}/erase-me-cargo-install-root
        shell: bash
        run: |
          # Keep this list and the key above identical to the rust-pr job.
          cargo +"$RUST_TOOLCHAIN" install cargo-nextest --version 0.9.143 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-audit --version 0.22.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-deny --version 0.20.2 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-hack --version 0.6.45 --locked
          cargo +"$RUST_TOOLCHAIN" install cargo-llvm-cov --version 0.9.0 --locked

  rust-native:
    name: Rust / native (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, macos-15-intel, windows-2025, windows-11-arm]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Retain immutable MCP oracle source across squash merges
        shell: bash
        run: |
          git fetch --no-tags --no-write-fetch-head --depth=1 origin 0bc6b051890340822448fa3846c96f70022b79ad
          git cat-file -e '0bc6b051890340822448fa3846c96f70022b79ad^{commit}'

      - name: Check frozen MCP stdio corpus and cleanup controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_mcp_stdio_oracle_check.py
          python3 tests/test_mcp_stdio_oracle_cleanup.py

      - name: Cache Cargo dependencies and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Format
        shell: bash
        run: cargo +"$RUST_TOOLCHAIN" fmt --all --check

      - name: Check and lint
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" check --workspace --all-targets --all-features --locked
          cargo +"$RUST_TOOLCHAIN" clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify registry build at 1024 descriptors
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test ! -e "$RUNNER_TEMP/registry-fd-target"
          (
            ulimit -n 1024
            CARGO_TARGET_DIR="$RUNNER_TEMP/registry-fd-target" CARGO_BUILD_JOBS=2 \
              cargo +"$RUST_TOOLCHAIN" check -p symeraseme-core --locked
          )

      - name: Replay all 678 frozen MCP stdio observations through Rust
        shell: bash
        run: |
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test -p symeraseme-cli --test mcp_stdio_mutation_process --locked \
            -- --exact malformed_and_boundary_stdio_matches_source_bound_go_process \
            2>&1 | tee "$RUNNER_TEMP/mcp-stdio-replay.log"
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/mcp-stdio-replay.log"

      - name: Retain frozen MCP stdio replay diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-stdio-replay-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/mcp-stdio-replay.log
          if-no-files-found: error
          retention-days: 7

      - name: Test and doctest
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo +"$RUST_TOOLCHAIN" test --workspace --all-features --locked
          cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked

      - name: Capture independent Windows identity for workspace tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'rust-native-identity/baseline.json'
          ./scripts/capture-windows-identity.ps1 -Mode Capture -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact

      - name: Windows test and doctest with verified native identity
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ runner.arch }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'rust-native-identity/baseline.json'
          $env:SYMERASEME_WINDOWS_IDENTITY_BASELINE = $artifact
          $tests = @'
          set -euo pipefail
          cargo +"$RUST_TOOLCHAIN" test --workspace --all-features --locked --no-fail-fast
          cargo +"$RUST_TOOLCHAIN" test --workspace --doc --all-features --locked
          '@
          ./scripts/capture-windows-identity.ps1 -Mode Verify -ExpectedArch $env:EXPECTED_ARCH -ExpectedRevision $env:EXPECTED_REVISION -ArtifactPath $artifact -BashScript $tests
          exit $LASTEXITCODE

      - name: Verify recorded whole plan and Unix processes with Go absent on all six native hosts
        shell: bash
        run: python3 scripts/verify-frozen-plan-without-go.py

      - name: Run neutral parity subset on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: make parity
