[advisories]
version = 2

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip-tree = [
    # cap-std 4.0.3 deliberately supports several Windows API generations;
    # isolate only its pinned platform graph while keeping the workspace-wide
    # duplicate-version denial intact.
    { name = "cap-std", version = "=4.0.3" },
    { name = "cap-fs-ext", version = "=4.0.3" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
