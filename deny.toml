[advisories]
version = 2

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip-tree = [
    # cap-std 4.0.3 deliberately supports several Windows API generations;
    # isolate only its pinned platform graph while keeping the workspace-wide
    # duplicate-version denial intact.
    { name = "cap-std", version = "=4.0.3" },
    { name = "cap-fs-ext", version = "=4.0.3" },
    # ureq's maintained rustls stack uses ring's legacy getrandom edge;
    # isolate only this pinned TLS subtree rather than allowing duplicates
    # workspace-wide.
    { name = "ring", version = "=0.17.14" },
    # rand 0.9 (also used by the test-only proptest graph) follows the
    # getrandom 0.3/r-efi 5 platform path while tempfile follows the newer
    # getrandom 0.4/r-efi 6 path; keep the exception scoped to rand's subtree.
    { name = "rand", version = "=0.9.5" },
]
# These exact leaf skips cover only the incompatible transitive edges in the
# verified SQLite adoption graph. rusqlite 0.40.2 uses hashlink 0.12.2 and
# hashbrown 0.17.1, while sqlite-wasm-rs 0.5.5 retains hashbrown 0.16.1.
# Existing yaml-rust2 and serde_yaml still require the older hashlink,
# hashbrown, and foldhash chain. CoreKit FS pins nix 0.30.1 while the consumer
# pins nix 0.31.3; these semver-incompatible upstream edges cannot be unified.
# Keep these allowances exact and leaf-scoped; remove them when the graph
# converges so multiple-versions denial remains the default everywhere else.
skip = [
    { name = "foldhash", version = "=0.1.5" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "hashbrown", version = "=0.16.1" },
    { name = "hashlink", version = "=0.10.0" },
    { name = "nix", version = "=0.30.1" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/danieljustus/symaira-corekit"]
