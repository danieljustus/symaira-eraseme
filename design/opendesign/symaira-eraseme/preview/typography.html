<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Symaira EraseMe — typography</title><link rel="stylesheet" href="../tokens.css"><style>*{box-sizing:border-box}body{padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body);max-width:980px}h1{font:700 clamp(36px,6vw,72px)/1 var(--font-display);letter-spacing:-.04em}h2{font-size:30px}p{color:var(--muted-readable,var(--muted));font-size:18px;line-height:1.6}code{font-family:var(--font-mono);color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}.swatch{min-height:140px;padding:16px;border:1px solid var(--border);border-radius:var(--radius-card,12px);background:var(--surface-opaque,var(--surface));display:flex;align-items:end}.accent{border-top:16px solid var(--accent)}.positive{border-top:16px solid var(--positive)}.warning{border-top:16px solid var(--warning)}.critical{border-top:16px solid var(--critical)}.stack{display:grid;gap:12px}.stack div{min-width:70px;padding:12px;background:var(--accent);color:var(--accent-on);border-radius:8px}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}</style></head><body><main data-od-id="typography-preview"><p class="eyebrow">Symaira EraseMe</p><p class="eyebrow">PRODUCT SYSTEM</p><h1>Designed for calm control.</h1><h2>Clear hierarchy, honest states.</h2><p>Readable body copy stays useful at narrow widths and high zoom.</p><code>symtool command --json</code></main></body></html>
