<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Symaira EraseMe — Components</title><link rel="stylesheet" href="tokens.css"><style>*{box-sizing:border-box}body{padding:32px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}main{max-width:980px}.row{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}button{min-height:44px;padding:10px 16px;border-radius:var(--radius-control,10px);border:1px solid var(--border);background:var(--surface-opaque,var(--surface));color:var(--fg);font:inherit}button.primary{background:var(--accent);color:var(--accent-on);border-color:transparent}button:disabled{opacity:.55}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.notice{padding:16px;border-radius:var(--radius-card,12px);border-left:5px solid var(--informative,var(--accent));background:var(--surface-opaque,var(--surface))}.status{display:inline-flex;padding:6px 10px;border-radius:999px;background:color-mix(in srgb,var(--positive) 18%,transparent);color:var(--fg)}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main data-od-id="component-fixture"><h1>Symaira EraseMe components</h1><div class="row"><button class="primary">Primary action</button><button>Secondary action</button><button disabled>Unavailable</button></div><p class="notice" role="status">Informative state with a concrete next step.</p><p><span class="status">Ready</span></p></main></body></html>
