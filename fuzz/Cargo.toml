test = false
doc = false
bench = false

[[bin]]
name = "path_inputs"
path = "fuzz_targets/path_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "email_headers"
path = "fuzz_targets/email_headers.rs"
test = false
doc = false
bench = false
