edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.9"
symeraseme-core = { path = "../crates/symeraseme-core", version = "0.13.0" }

