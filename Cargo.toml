[workspace]
resolver = "3"
members = [
    "crates/symeraseme-core",
    "crates/symeraseme-engine",
    "crates/symeraseme-cli",
    "rust-tests/parity",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
authors = ["Daniel Justus"]
description = "Privacy-first data broker removal automation"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-eraseme"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
