[workspace]
resolver = "3"
members = [
    "crates/symeraseme-core",
    "crates/symeraseme-engine",
    "crates/symeraseme-cli",
    "rust-tests/parity",
]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
authors = ["Daniel Justus"]
description = "Privacy-first data broker removal automation"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-eraseme"

[workspace.dependencies]
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
flate2 = "1.1.10"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
tar = "0.4.44"
tempfile = "3.27.0"
toml = "0.5.11"
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
yaml-rust2 = "0.10.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
