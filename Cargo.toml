[workspace]
resolver = "3"
members = [
    "crates/symeraseme-core",
    "crates/symeraseme-engine",
    "crates/symeraseme-cli",
    "rust-tests/parity",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.13.0"
edition = "2024"
rust-version = "1.98"
authors = ["Daniel Justus"]
description = "Privacy-first data broker removal automation"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-eraseme"

[workspace.dependencies]
aes = "0.8.4"
base64 = "0.23.1"
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
cbc = "0.1.2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
flate2 = "1.1.10"
hmac = "0.12.1"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
symaira-core-version = { version = "=0.0.0", git = "https://github.com/danieljustus/symaira-corekit", rev = "27177f25f551cecefa7bd6c4524abf175b3a75c7" }
tar = "0.4.44"
tempfile = "3.27.0"
toml = "0.5.11"
ureq = { version = "3.4.1", default-features = false, features = ["rustls"] }
yaml-rust2 = "0.10.2"
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "fuel", "serde", "std_collections"] }
pbkdf2 = { version = "0.12.2", features = ["hmac"] }
regex = "1.11.3"
sha2 = "0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
